# Code style and linting check
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages:
            any::lintr
            any::styler

      - name: Lint
        continue-on-error: true
        run: |
          result <- tryCatch(
            lintr::lint_package(),
            error = function(e) {
              message("lintr error: ", conditionMessage(e))
              data.frame()
            }
          )
          n <- if (is.data.frame(result)) nrow(result) else 0
          if (n > 0) {
            print(result)
            message(sprintf("\n%d lint(s) found (non-blocking)", n))
          } else {
            message("No lints found")
          }
        shell: Rscript {0}

    continue-on-error: true
      - name: Check code style
        run: |
          changed <- tryCatch({
            styled <- styler::style_pkg(dry = "on")
            if (!is.null(styled)) sum(styled$changed) else 0
          }, error = function(e) {
            message("styler check skipped: ", conditionMessage(e))
            0
          })
          if (changed > 0) {
            message(sprintf("NOTE: %d file(s) need styling. Run styler::style_pkg().", changed))
          } else {
            message("Code style: OK")
          }
        shell: Rscript {0}
