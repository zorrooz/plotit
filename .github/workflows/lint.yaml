# Code style and linting check
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages:
            any::lintr
            any::styler

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}

      - name: Check code style
        run: |
          styled <- tryCatch(
            styler::style_pkg(dry = "on"),
            error = function(e) NULL
          )
          if (!is.null(styled) && any(styled$changed)) {
            cli::cli_abort(c(
              "Code is not styled correctly.",
              "i" = "Run {.code styler::style_pkg()} and commit the changes."
            ))
          }
        shell: Rscript {0}
