# =============================================================================
# R 包 CI 工作流模板 (Reusable Template)
# =============================================================================
# 使用说明：
#   1. 将此文件复制到新项目的 .github/workflows/ 目录
#   2. 按需修改触发分支、R 版本矩阵和额外依赖
#   3. 确保 GitHub Pages 已启用（用于 pkgdown）
#
# 本模板汇总了多次 CI 调试的教训——详见 AGENTS.md §11
#
# 设计原则（AGENTS.md §11 映射）：
#   §11.1 - extra-packages 使用 block scalar `|`，不用 YAML mapping
#   §11.2 - check-r-package 不加非标准参数（避免 0 秒初始化失败）
#   §11.7 - continue-on-error 分 step/job 两级精确设置
# =============================================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:

  # ===========================================================================
  # R CMD check — 多 OS / 多 R 版本矩阵
  # ===========================================================================
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})

    # §11.7: job 级 continue-on-error — R-devel 已知不稳定，允许失败不阻塞 pipeline
    continue-on-error: ${{ matrix.config.r == 'devel' }}

    strategy:
      fail-fast: false     # 一个 OS 失败不取消其他 OS
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macOS-latest,   r: 'release'}
          # §11.2: R-devel 需要 http-user-agent 让 RSPM 正确提供二进制包
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}

    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_SYSTEM_CLOCK_: false    # 跳过时间相关的测试

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # §11.2: 不加 upload-snapshots/error-on 等非标准参数
      # 使用默认值（error-on="error"），避免 action 初始化阶段 0 秒失败
      - uses: r-lib/actions/check-r-package@v2

  # ===========================================================================
  # lint + code style — 信息性检查，不阻塞 CI
  # ===========================================================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # §11.1: 多行依赖用 block scalar `|`，不用 YAML mapping
          extra-packages: |
            any::lintr
            any::styler

      # §11.7: step 级 continue-on-error — lint 是建议性信息，不阻塞 pipeline
      - name: Lint
        continue-on-error: true
        run: |
          result <- tryCatch(
            lintr::lint_package(),
            error = function(e) {
              message("lintr error: ", conditionMessage(e))
              data.frame()
            }
          )
          n <- if (is.data.frame(result)) nrow(result) else 0
          if (n > 0) {
            print(result)
            message(sprintf("\n%d lint(s) found (non-blocking)", n))
          } else {
            message("No lints found")
          }
        shell: Rscript {0}

      # §11.7: styler 检查同样是信息性的
      - name: Check code style
        continue-on-error: true
        run: |
          changed <- tryCatch({
            styled <- styler::style_pkg(dry = "on")
            if (!is.null(styled)) sum(styled$changed) else 0
          }, error = function(e) {
            message("styler check skipped: ", conditionMessage(e))
            0
          })
          if (changed > 0) {
            message(sprintf("NOTE: %d file(s) need styling. Run styler::style_pkg().", changed))
          } else {
            message("Code style: OK")
          }
        shell: Rscript {0}

  # ===========================================================================
  # 测试覆盖率 — 上传到 Codecov
  # ===========================================================================
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr

      # §11.7: 无 Codecov token 时静默失败
      - name: Test coverage
        continue-on-error: true
        run: covr::codecov(quiet = FALSE)
        shell: Rscript {0}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.*

  # ===========================================================================
  # pkgdown — 构建并发布到 GitHub Pages
  # ===========================================================================
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # 只在 main 分支和有 secret 时运行
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # 注意：pkgdown >= 2.0 已移除 install 参数，直接用默认值
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
