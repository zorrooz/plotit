url: https://zorrooz.github.io/plotit/
template:
  bootstrap: 5
  includes:
    in_header: |
      <style>.r-plt { display: block; margin: 1rem 0; }
      .r-plt img { display: block; max-width: 100%; height: auto; margin: 0 auto; background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }</style>

# Reference-example figure canvas.  WYSIWYG plots bake an absolute panel
# size into the ggplot, so the device must exceed panel + axis/legend
# chrome or the edges clip.  Defaults fit the 5x3.5 in panel with room for
# wide legends and compose_* examples.
figures:
  dev: ragg::agg_png
  dpi: 96
  fig.retina: 2
  fig.width: 8.5
  fig.height: 5.5

title: plotit
subtitle: Declarative Plotting with ggplot2

development:
  mode: auto

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/plotit.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/plotit.html
      - text: Customizing Plots
        href: articles/customizing.html
      - text: Composing Figures
        href: articles/composing.html
      - text: Relational Charts
        href: articles/relational.html
      - text: "---"
      - text: "Gallery: Groups"
        href: articles/gallery-groups.html
      - text: "Gallery: Distributions"
        href: articles/gallery-distributions.html
      - text: "Gallery: Relationships"
        href: articles/gallery-relationships.html
      - text: "Gallery: Time & Coordinates"
        href: articles/gallery-coordinates.html
      - text: "Gallery: Relational"
        href: articles/gallery-relational.html
      - text: "Gallery: Annotation & Composition"
        href: articles/gallery-composing.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/zorrooz/plotit
      aria-label: GitHub repository

reference:
- title: Plot Construction
  contents:
  - plotit
  - encode
  - add_ggplot
- title: Geometric Layers
  desc: Add visual marks to your plot.
  contents:
  - starts_with("mark_")
- title: Scales
  desc: Control how data maps to visual properties.
  contents:
  - starts_with("scale_")
- title: Graph Data & Layout
  desc: Build relational graphs and compute layouts (Vega-style data transforms).
  contents:
  - as_graph
  - starts_with("layout_")
- title: Labels
  desc: Set titles, axis labels, and legend text.
  contents:
  - starts_with("label_")
- title: Coordinate Systems
  desc: Transform the coordinate space.
  contents:
  - starts_with("project_")
- title: Facets
  desc: Split data into subplots.
  contents:
  - starts_with("split_")
- title: Composition
  desc: Combine multiple plots into layouts.
  contents:
  - starts_with("compose_")
- title: Theme
  desc: Style your plots with built-in or custom themes.
  contents:
  - style
- title: Export
  desc: Render and save your plots to files.
  contents:
  - export
- title: Customization
  desc: Extend plotit with custom marks and themes.
  contents:
  - make_mark
  - make_theme

# Exclude from search, sitemap, and navbar.
# pkgdown's build_home() always renders root .md files; CI workflow
# removes AGENTS.html post-build — see .github/workflows/pkgdown.yaml.
exclude:
- AGENTS.md
